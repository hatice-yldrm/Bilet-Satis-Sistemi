<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Bilet Satış Sistemi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="logo görseli.png" alt="logo görseli">
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-item">Ana Sayfa</a></li>
                <li><a href="etkinlikler.html" class="nav-item">Tüm Etkinlikler</a></li>
                <li><a href="iletisim.html" class="nav-item">İletişim</a></li>
            </ul>
            <div class="buttons">
                <a href="giris_kayit.html"><button class="giris-button">Giriş/Kayıt</button></a>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <h2 style="margin-bottom: 20px; color: #0f172a;">Bize Ulaşın</h2>
            <p style="margin-bottom: 20px; color: #64748b;">Sorularınız veya önerileriniz için aşağıdaki formu
                doldurabilirsiniz.</p>

            <form action="#">
                <input type="text" placeholder="Ad Soyad" required>
                <input type="email" placeholder="E-posta Adresiniz" required>
                <textarea placeholder="Mesajınız" rows="5"
                    style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; resize: none;"></textarea>
                <button type="submit" class="buy-btn" style="width: 100%;">Mesajı Gönder</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-info">
                <img src="logo görseli.png" alt="Logo" class="footer-logo">
                <p>Eğlenceye giden en kısa yol.</p>
            </div>
            <div class="footer-links-group">
                <h4>Hızlı Menü</h4>
                <ul>
                    <li><a href="index.html">Ana Sayfa</a></li>
                    <li><a href="etkinlikler.html">Tüm Etkinlikler</a></li>
                    <li><a href="iletisim.html">İletişim</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Bilet Satış ve Rezervasyon Sistemi</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
